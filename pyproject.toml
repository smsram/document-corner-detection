[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "document-corner-detection"
version = "1.0.0"
description = "Real-time document corner detection for edge deployment using YOLOv8-seg"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["document scanning", "corner detection", "yolov8", "computer vision", "android", "tflite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.20.0",
    "Pillow>=9.4.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
export = ["tensorflow>=2.12.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/smsram/document-corner-detection"
Repository = "https://github.com/smsram/document-corner-detection"
Issues = "https://github.com/smsram/document-corner-detection/issues"

[project.scripts]
doc-infer  = "src.infer:main"
doc-webcam = "src.webcam:main"
doc-export = "src.export:main"
doc-train  = "training.train:main"
doc-test   = "training.test:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data_prep*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

